{% extends "base.html" %}
{% block content %}
<div class="container mt-5" style="max-width: 400px;">
    <h2 class="mb-4 text-center">Admin Login</h2>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" name="first_name" placeholder="Admin first name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" placeholder="Admin password" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">Login as Admin</button>
    </form>

    <hr class="my-4">
    <div class="text-center">
        <small>Not an admin? <a href="{{ url_for('login_attendee') }}">Login as Attendee</a></small>
    </div>
</div>
{% endblock %}
