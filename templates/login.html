{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>Login</h2>

    <!-- Attendee login form -->
    <form method="post" id="attendee-form">
        <div class="mb-3">
            <label for="passphrase" class="form-label">Event Passphrase</label>
            <input type="text" class="form-control" id="passphrase" name="passphrase" required>
        </div>
        <div class="mb-3">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" class="form-control" id="first_name" name="first_name" required>
        </div>
        <div class="mb-3">
            <label for="last_name" class="form-label">Email Address</label>
            <input type="text" class="form-control" id="last_name" name="last_name" required>
        </div>
        <div class="mb-3">
            <label for="organisation" class="form-label">Organisation (optional)</label>
            <input type="text" class="form-control" id="organisation" name="organisation">
        </div>
        <button type="submit" class="btn btn-primary">Enter Event</button>
    </form>

    <hr>

    <!-- Toggle button -->
    <button class="btn btn-link" onclick="toggleAdminLogin()">Admin Login</button>

    <!-- Admin login form (hidden by default) -->
    <form method="post" id="admin-form" style="display:none;">
        <div class="mb-3">
            <label for="username" class="form-label">Admin Username</label>
            <input type="text" class="form-control" id="username" name="username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Admin Password</label>
            <input type="password" class="form-control" id="password" name="password">
        </div>
        <button type="submit" class="btn btn-danger">Login as Admin</button>
    </form>
</div>

<script>
function toggleAdminLogin() {
    const form = document.getElementById("admin-form");
    form.style.display = (form.style.display === "none") ? "block" : "none";
}
</script>
{% endblock %}
