{% extends "base.html" %}
{% block content %}
<h2>All Interests Submited (Admin View)</h2>

<table class="table table-striped">
  <thead>
    <tr>
      <th>User</th>
      <th>Option 1</th>
      <th>Timestamp</th>
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      <td>{{ row['username'] }}</td>
      <td>{{ row['phrase'] }}</td>
      <td>{{ row['timestamp'] }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
<a href="{{ url_for('interactive_session_admin') }}" class="btn btn-secondary mt-3">Back</a>
{% endblock %}
