{% extends "base.html" %}
{% block content %}
<h2>Quick Login</h2>
<p class="text-muted">Enter your first name and email to log back in.</p>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="POST">
  <div class="mb-3">
    <label for="first_name" class="form-label">First Name</label>
    <input type="text" class="form-control" id="first_name" name="first_name" required>
  </div>
  <div class="mb-3">
    <label for="last_name" class="form-label">Email</label>
    <input type="last_name" class="form-control" id="last_name" name="last_name" required>
  </div>
  <button type="submit" class="btn btn-primary">Login</button>
</form>

<p class="mt-3">
  New here? <a href="{{ url_for('login_attendee') }}">Register instead</a>.
</p>
{% endblock %}
